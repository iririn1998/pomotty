name: CI

on:
  # Run on PRs against the merged result, and on main after merging.
  # Other branch pushes are covered by their PR, so they are skipped to
  # avoid running the same checks twice.
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Cancel superseded runs on the same ref so queued macOS jobs don't pile up.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Sound playback differs on each OS, so test each OS on the minimum
        # Node.js version supported by engines (>=22.18.0). macOS runners are
        # not used because their jobs stay queued without being picked up; the
        # darwin code paths are covered by platform-injected unit tests.
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.2.2

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.18.x
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - parallel:
          - name: Type check
            run: pnpm typecheck

          - name: Run tests
            if: ${{ matrix.os != 'ubuntu-latest' }}
            run: pnpm test

          # Measure coverage once and fail if it drops below the thresholds.
          - name: Run tests with coverage
            if: ${{ matrix.os == 'ubuntu-latest' }}
            run: pnpm test:coverage

          - name: Run lint
            run: pnpm lint

          - name: Check formatting
            run: pnpm format:check

      - name: Build
        run: pnpm build

  package:
    name: Package
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.2.2

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.18.x
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # prepack runs the type check, build, and tests before packing.
      - name: Pack package
        run: pnpm pack --pack-destination "$RUNNER_TEMP/package"

      - name: Verify package contents
        working-directory: ${{ runner.temp }}/package
        run: |
          tar -tzf pomotty-*.tgz | sort > actual.txt
          printf '%s\n' \
            package/LICENSE \
            package/README.ja.md \
            package/README.md \
            package/assets/break-end.wav \
            package/assets/work-end.wav \
            package/dist/cli.js \
            package/package.json | sort > expected.txt
          diff -u expected.txt actual.txt

      - name: Run packaged CLI from another directory
        working-directory: ${{ runner.temp }}/package
        run: |
          tar -xzf pomotty-*.tgz
          test "$(head -n 1 package/dist/cli.js)" = '#!/usr/bin/env node'
          node package/dist/cli.js --help | grep -q '^Usage: pomotty \[OPTIONS\]$'
          set +e
          node package/dist/cli.js < /dev/null > output.txt
          exit_code=$?
          set -e
          test "$exit_code" -eq 0
          tail -n 1 output.txt | grep -q 'Work was not started.'
