name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: Checks (${{ matrix.os }}, Node.js ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Sound playback differs on each OS, and engines supports Node.js
        # ^22.18.0 || >=24.11.0, so test both lower bounds on every OS.
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: [22.18.x, 24.11.x]
        include:
          - os: ubuntu-latest
            node-version: 24.x
          - os: ubuntu-latest
            node-version: current
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.2.2

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - parallel:
          - name: Type check
            run: pnpm typecheck

          - name: Run tests
            run: pnpm test

          - name: Run lint
            run: pnpm lint

          - name: Check formatting
            run: pnpm format:check

      - name: Build
        run: pnpm build

  package:
    name: Package
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.2.2

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.18.x
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # prepack runs the type check, build, and tests before packing.
      - name: Pack package
        run: pnpm pack --pack-destination "$RUNNER_TEMP/package"

      - name: Verify package contents
        working-directory: ${{ runner.temp }}/package
        run: |
          tar -tzf pomotty-*.tgz | sort > actual.txt
          printf '%s\n' \
            package/LICENSE \
            package/README.ja.md \
            package/README.md \
            package/assets/break-end.wav \
            package/assets/work-end.wav \
            package/dist/cli.js \
            package/package.json | sort > expected.txt
          diff -u expected.txt actual.txt

      - name: Run packaged CLI from another directory
        working-directory: ${{ runner.temp }}/package
        run: |
          tar -xzf pomotty-*.tgz
          test "$(head -n 1 package/dist/cli.js)" = '#!/usr/bin/env node'
          node package/dist/cli.js --help | grep -q '^Usage: pomotty \[OPTIONS\]$'
          set +e
          node package/dist/cli.js < /dev/null > output.txt
          exit_code=$?
          set -e
          test "$exit_code" -eq 0
          tail -n 1 output.txt | grep -q 'Work was not started.'
