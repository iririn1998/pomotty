name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: Publish to npm and create GitHub release
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.2.2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # Trusted publishing requires npm >= 11.5.1, which Node.js 24 bundles.
          # registry-url is omitted because it writes a placeholder token to
          # .npmrc that stops npm from performing the OIDC exchange.
          node-version: 24.x
          cache: pnpm

      - name: Verify tag matches package version
        run: |
          package_version="v$(node -p 'require("./package.json").version')"
          if [ "$GITHUB_REF_NAME" != "$package_version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $package_version"
            exit 1
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

      - name: Run lint
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check

      - name: Pack package
        run: pnpm pack --pack-destination "$RUNNER_TEMP/package"

      # pnpm publish's own OIDC exchange is rejected by npm, so publish the
      # tarball with the npm CLI. It runs outside the repository because
      # devEngines rejects npm there.
      - name: Publish to npm
        working-directory: ${{ runner.temp }}/package
        run: npm publish ./pomotty-*.tgz

      - name: Create GitHub release
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
